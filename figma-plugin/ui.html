<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voronoi Shatter — Figma Bridge</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --bg: #161618;
        --panel: #1f1f23;
        --border: #2e2e34;
        --ink: #f4f4f5;
        --muted: #a1a1aa;
        --accent: #3b82f6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 12px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }

      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #71717a;
        flex-shrink: 0;
      }

      .status-dot.ready {
        background: #22c55e;
      }

      .status-text {
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-shrink: 0;
      }

      button {
        appearance: none;
        border: 1px solid var(--border);
        background: #27272c;
        color: var(--ink);
        border-radius: 6px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
      }

      button:hover:not(:disabled) {
        background: #323238;
      }

      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #ffffff;
      }

      button.primary:hover:not(:disabled) {
        filter: brightness(1.08);
      }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
        background: var(--bg);
      }

      .fallback {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 24px;
        text-align: center;
        background: var(--bg);
      }

      .fallback[hidden] {
        display: none;
      }

      .fallback p {
        margin: 0;
        max-width: 420px;
        font-size: 13px;
        line-height: 1.5;
        color: var(--muted);
      }

      .url-form {
        display: flex;
        gap: 6px;
        width: 100%;
        max-width: 420px;
      }

      .url-form input {
        flex: 1;
        min-width: 0;
        padding: 6px 10px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--ink);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-left">
        <span id="statusDot" class="status-dot" aria-hidden="true"></span>
        <span id="statusText" class="status-text">Connecting to Voronoi Shatter studio…</span>
      </div>
      <div class="actions">
        <button id="exportPngBtn" type="button" disabled>Insert PNG</button>
        <button id="exportSvgBtn" type="button" class="primary" disabled>Insert SVG</button>
      </div>
    </header>

    <main class="stage">
      <iframe
        id="studioFrame"
        title="Voronoi Shatter Studio"
        allow="clipboard-read; clipboard-write"
      ></iframe>

      <section id="fallback" class="fallback" hidden>
        <strong>Voronoi Shatter Studio</strong>
        <p>
          Start the studio dev server (<code>npm run dev</code>) or enter a hosted studio URL with
          <code>?embed=1</code> to connect the bridge.
        </p>
        <form id="urlForm" class="url-form">
          <input
            id="studioUrlInput"
            type="url"
            value="http://localhost:5173/?embed=1"
            aria-label="Studio URL"
            required
          />
          <button type="submit" class="primary">Load</button>
        </form>
      </section>
    </main>

    <script>
      (function () {
        const DEFAULT_STUDIO_URL = 'http://localhost:5173/?embed=1';
        const frame = document.getElementById('studioFrame');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const exportSvgBtn = document.getElementById('exportSvgBtn');
        const exportPngBtn = document.getElementById('exportPngBtn');
        const fallback = document.getElementById('fallback');
        const urlForm = document.getElementById('urlForm');
        const studioUrlInput = document.getElementById('studioUrlInput');

        let studioReady = false;
        let fallbackTimer = null;

        function setReady(ready, label) {
          studioReady = ready;
          statusDot.classList.toggle('ready', ready);
          statusText.textContent = label;
          exportSvgBtn.disabled = !ready;
          exportPngBtn.disabled = !ready;
          if (ready) {
            fallback.hidden = true;
            if (fallbackTimer) {
              clearTimeout(fallbackTimer);
              fallbackTimer = null;
            }
          }
        }

        function loadStudio(url) {
          setReady(false, 'Connecting to Voronoi Shatter studio…');
          fallback.hidden = true;
          frame.src = url;
          if (fallbackTimer) clearTimeout(fallbackTimer);
          fallbackTimer = setTimeout(() => {
            if (!studioReady) {
              statusText.textContent = 'Waiting for studio at ' + url;
              fallback.hidden = false;
            }
          }, 3000);
        }

        function postToFigma(pluginMessage) {
          parent.postMessage({ pluginMessage }, '*');
        }

        function postToStudio(message) {
          if (!frame.contentWindow) return;
          frame.contentWindow.postMessage(message, '*');
        }

        exportSvgBtn.addEventListener('click', () => {
          postToStudio({ type: 'voronoi:export', format: 'svg' });
        });

        exportPngBtn.addEventListener('click', () => {
          postToStudio({ type: 'voronoi:export', format: 'png' });
        });

        urlForm.addEventListener('submit', (event) => {
          event.preventDefault();
          const url = studioUrlInput.value.trim();
          if (url) loadStudio(url);
        });

        window.addEventListener('message', (event) => {
          const data = event.data;
          if (!data || typeof data !== 'object') return;

          // Messages from Figma plugin main thread (code.js)
          if (data.pluginMessage && typeof data.pluginMessage === 'object') {
            postToStudio(data.pluginMessage);
            return;
          }

          // Messages from Voronoi Shatter studio iframe
          if (event.source !== frame.contentWindow) return;

          if (data.type === 'voronoi:ready') {
            setReady(true, 'Studio connected');
            return;
          }

          if (data.type === 'voronoi:export-result') {
            if (data.format === 'svg' && typeof data.svg === 'string') {
              postToFigma({ type: 'insert-svg', svg: data.svg });
            } else if (data.format === 'png' && data.bytes) {
              postToFigma({
                type: 'insert-png',
                bytes: data.bytes,
                width: data.width,
                height: data.height,
              });
            }
          }
        });

        const params = new URLSearchParams(window.location.search);
        const initialUrl = params.get('studio') || DEFAULT_STUDIO_URL;
        studioUrlInput.value = initialUrl;
        loadStudio(initialUrl);
      })();
    </script>
  </body>
</html>
